  <script>
    function setMemberFilter(member, el) {
      window.setAttendanceFilter(member);
      document.querySelectorAll(".chip-btn").forEach(b => {
        b.className = "chip-btn bg-white border border-slate-200 text-slate-700 text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-1.5 flex-shrink-0 hover:bg-slate-50";
      });
      el.className = "chip-btn bg-blue-600 text-white text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-1.5 flex-shrink-0 shadow-sm";
    }

    function handleSearch(val) {
      window.setAttendanceSearch(val);
    }

    // Tính tổng công riêng từng người từ toàn bộ data
    function renderPerWorkerSummary() {
      const container = document.getElementById("per-worker-summary");
      if (!container) return;

      const list = window.supabaseAttendanceList || [];
      const workerMap = {}; // { name: { code, color, cong } }

      list.forEach(item => {
        item.workers.forEach(w => {
          if (!workerMap[w.name]) {
            workerMap[w.name] = { code: w.code, color: w.color || 'blue', cong: 0 };
          }
          workerMap[w.name].cong += (w.cong || 0);
        });
      });

      const colorMap = {
        blue: 'bg-blue-100 text-blue-700',
        green: 'bg-emerald-100 text-emerald-700',
        indigo: 'bg-indigo-100 text-indigo-700',
        orange: 'bg-orange-100 text-orange-700',
        purple: 'bg-purple-100 text-purple-700'
      };

      const workers = Object.entries(workerMap);
      if (workers.length === 0) {
        container.innerHTML = `<p class="text-[11px] text-slate-400 italic text-center py-2">Chưa có dữ liệu</p>`;
        return;
      }

      container.innerHTML = workers.map(([name, info]) => {
        const avatarClass = colorMap[info.color] || 'bg-blue-100 text-blue-700';
        const percent = Math.min(100, (info.cong / 45) * 100); // 45 = tổng tháng mẫu
        return `
          <div class="flex items-center gap-2.5">
            <span class="w-6 h-6 rounded-full ${avatarClass} text-[10px] font-bold flex items-center justify-center flex-shrink-0">${info.code}</span>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between mb-0.5">
                <span class="text-xs font-semibold text-slate-800 truncate">${name}</span>
                <span class="text-xs font-extrabold text-blue-700 ml-2 flex-shrink-0">${info.cong.toFixed(1)} công</span>
              </div>
              <div class="w-full bg-blue-100 rounded-full h-1.5">
                <div class="bg-blue-600 h-1.5 rounded-full transition-all" style="width: ${percent.toFixed(0)}%"></div>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    window.renderPerWorkerSummary = renderPerWorkerSummary;
    document.addEventListener("supabase-attendance-loaded", renderPerWorkerSummary);
  </script>
