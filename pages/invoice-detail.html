<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Chi Tiết Hóa Đơn - Quản Lý Công Việc</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="../css/common.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/invoice.css"/>
  <style>
    .a4-sheet { visibility: hidden; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex items-center justify-center p-0">
  <div class="device-wrapper">
    <div class="app-container">
      <div class="bg-white border-b border-slate-100 p-3.5 flex items-center justify-between z-30 sticky top-0 no-print">
        <a href="invoices.html" class="w-8 h-8 rounded-xl bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition">
          <i class="fas fa-arrow-left text-xs"></i>
        </a>
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded-lg bg-blue-600 flex items-center justify-center text-white text-[11px] font-bold shadow-sm"><i class="fas fa-check"></i></div>
          <span class="font-bold text-slate-800 text-sm">Chi Tiết Hóa Đơn</span>
        </div>
        <a href="login.html" class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs shadow"><i class="fas fa-user"></i></a>
      </div>

      <div class="bg-white px-3.5 py-2.5 border-b border-slate-100 flex items-center justify-between gap-1.5 z-20 no-print">
        <a href="invoice-create.html" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-bold flex items-center gap-1 transition flex-shrink-0">
          <i class="fas fa-pen text-[10px]"></i> Chỉnh sửa
        </a>
        <button type="button" onclick="handleSaveInvoicePdf()" class="px-2.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-bold flex items-center gap-1 transition flex-shrink-0">
          <i class="fas fa-download text-[10px]"></i> Lưu hóa đơn
        </button>
      </div>

      <div class="app-scroll-area has-action-bar p-3.5 space-y-3 bg-slate-100">
        <div class="bg-blue-50/90 border border-blue-100 rounded-xl px-3 py-1.5 flex items-center justify-between text-[11px] text-blue-900 font-semibold no-print">
          <div class="flex items-center gap-1.5"><i class="far fa-circle-check text-blue-600"></i><span>Chi tiết thanh toán hóa đơn</span></div>
        </div>
        <div class="a4-sheet font-sans border border-slate-200"></div>
      </div>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="../js/invoice-pdf.js"></script>
  <script type="module" src="../js/invoice-detail.js"></script>
</body>
</html>
