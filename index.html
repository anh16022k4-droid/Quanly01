  <!-- Simulator Main Container -->
  <main class="flex-1 flex items-center justify-center p-0 sm:p-4 overflow-hidden">
    <div id="simulator-container" class="simulator-frame w-full overflow-hidden bg-white relative flex flex-col">
      <iframe id="page-iframe" src="pages/login.html" class="w-full h-full border-0" title="App Preview"></iframe>
    </div>
  </main>

  <script>
    let currentPage = "pages/home.html";

    function loadPage(url, btnElement) {
      currentPage = url;
      const iframe = document.getElementById("page-iframe");
      iframe.src = url;

      const directLink = document.getElementById("btn-direct-link");
      if (directLink) directLink.href = url;

      if (btnElement) {
        document.querySelectorAll(".nav-btn").forEach(b => {
          b.className = "nav-btn px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition flex items-center gap-1.5";
        });
        btnElement.className = "nav-btn px-2.5 py-1.5 rounded-lg bg-blue-600 text-white font-bold transition flex items-center gap-1.5";
      }
    }

    function setViewMode(mode) {
      const container = document.getElementById("simulator-container");
      const btnMobile = document.getElementById("btn-view-mobile");
      const btnFull = document.getElementById("btn-view-full");

      if (mode === "mobile") {
        container.className = "simulator-frame mobile-view w-full overflow-hidden bg-white relative flex flex-col";
        btnMobile.className = "px-2 py-1 rounded bg-blue-600 text-white font-bold transition";
        btnFull.className = "px-2 py-1 rounded text-slate-400 hover:text-white transition";
      } else {
        container.className = "simulator-frame full-view w-full overflow-hidden bg-white relative flex flex-col";
        btnFull.className = "px-2 py-1 rounded bg-blue-600 text-white font-bold transition";
        btnMobile.className = "px-2 py-1 rounded text-slate-400 hover:text-white transition";
      }
    }
  </script>
